<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10273b"><title>Weather Report</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#edf6f6;background:#10273b;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 5%,#296579 0,transparent 38%),#10273b}.wrap{width:min(100% - 32px,900px);margin:auto;padding:44px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8ddbd2}.date{color:#b7ced0;font-size:14px}.hero{margin:52px 0 26px}.hero h1{font-size:clamp(40px,8vw,72px);line-height:.98;letter-spacing:-.06em;margin:0 0 14px}.hero p{color:#b7ced0;margin:0}.search{display:flex;gap:10px;max-width:540px;margin:28px 0}.search input{flex:1;min-width:0;background:#f2f8f6;color:#172e3e;border:0;border-radius:12px;padding:14px 16px;font:inherit}.search button{border:0;border-radius:12px;padding:0 20px;background:#8ddbd2;color:#10273b;font-weight:700;font:inherit;cursor:pointer}.search button:hover{background:#b7eee7}.status{min-height:24px;color:#f3c985}.current{display:grid;grid-template-columns:1fr auto;align-items:center;padding:28px 30px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff0a}.place{font-size:20px;font-weight:650}.condition{color:#b7ced0;margin-top:6px}.temp{font-size:clamp(56px,12vw,96px);letter-spacing:-.08em;line-height:1}.meta{display:flex;gap:24px;color:#b7ced0;margin-top:20px}.forecast{margin-top:24px}.forecast h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:#8ddbd2}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{padding:16px 12px;border-radius:16px;background:#ffffff0a;border:1px solid #ffffff15}.day b{display:block;font-size:13px}.day span{display:block;color:#b7ced0;margin:14px 0 7px}.day strong{font-size:18px}.muted{color:#b7ced0;font-size:14px}footer{margin-top:40px;color:#8ba9ae;font-size:12px}@media(max-width:650px){.wrap{padding:28px 0}.hero{margin:42px 0 22px}.current{padding:22px 18px}.days{grid-template-columns:repeat(2,1fr)}.meta{gap:14px;flex-wrap:wrap}.date{font-size:12px}}
  </style>
</head>
<body><main class="wrap"><div class="top"><span class="brand">Field Notes / Weather</span><span class="date" id="today"></span></div><header class="hero"><h1>Weather,<br>where you are.</h1><p>A clear look at the sky today and through the week.</p></header><form class="search" id="form"><input id="city" aria-label="City" placeholder="Search a city, e.g. Chennai" value="Chennai"><button>Find weather</button></form><p class="status" id="status" role="status">Search for a city to load the forecast.</p><section id="result" aria-live="polite"></section><footer>Weather data by <a href="https://open-meteo.com/" style="color:inherit">Open-Meteo</a>.</footer></main>
<script>
const $=s=>document.querySelector(s);$('#today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());
const labels={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm'};
async function load(city){$('#status').textContent='Finding forecast…';$('#result').innerHTML='';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`).then(r=>r.json());if(!g.results?.length)throw Error('No matching city found. Try another name.');const p=g.results[0],q=new URLSearchParams({latitude:p.latitude,longitude:p.longitude,current:'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:'auto',forecast_days:7});const w=await fetch(`https://api.open-meteo.com/v1/forecast?${q}`).then(r=>r.json());const c=w.current,d=w.daily;$('#status').textContent='';$('#result').innerHTML=`<section class="current"><div><div class="place">${p.name}${p.admin1?`, ${p.admin1}`:''}</div><div class="condition">${labels[c.weather_code]||'Conditions updated'}</div><div class="meta"><span>Feels like ${Math.round(c.apparent_temperature)}°</span><span>Humidity ${c.relative_humidity_2m}%</span><span>Wind ${Math.round(c.wind_speed_10m)} km/h</span></div></div><div class="temp">${Math.round(c.temperature_2m)}°</div></section><section class="forecast"><h2>Next seven days</h2><div class="days">${d.time.map((date,i)=>`<article class="day"><b>${i?new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'}):'Today'}</b><span>${labels[d.weather_code[i]]||'Mixed'}</span><strong>${Math.round(d.temperature_2m_max[i])}°</strong><small class="muted"> / ${Math.round(d.temperature_2m_min[i])}°</small></article>`).join('')}</div></section>`}catch(e){$('#status').textContent=e.message||'Weather could not be loaded. Check your connection and try again.'}}
$('#form').addEventListener('submit',e=>{e.preventDefault();if($('#city').value.trim())load($('#city').value.trim())});load('Chennai');
</script></body></html>
